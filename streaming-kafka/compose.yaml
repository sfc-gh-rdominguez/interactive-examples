services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  connect:
    image: confluentinc/cp-kafka-connect:7.7.1
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8083:8083"]
    volumes: ["./plugins:/plugins"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: ia-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/plugins

  api:
    build: ./api
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8001:8001"]
    volumes: ["./keys:/keys:ro"]
    environment:
      SF_ACCOUNT: ${SF_ACCOUNT}
      SF_DASH_USER: ${SF_DASH_USER}
      SF_DASH_ROLE: ${SF_DASH_ROLE}
      SF_DASH_KEY_PATH: /keys/dash_key.p8
      SF_DB: ${SF_DB}
      SF_SCHEMA: ${SF_SCHEMA}
      SF_IWH: ${SF_IWH}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      SERVER_PORT: 8001

  # Producer + probe; run on demand: docker compose run --rm tools produce.py ...
  tools:
    build: ./scripts
    profiles: [tools]
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["./keys:/keys:ro"]
    environment:
      SF_ACCOUNT: ${SF_ACCOUNT}
      SF_SVC_USER: ${SF_SVC_USER}
      SF_ROLE: ${SF_ROLE}
      SF_DB: ${SF_DB}
      SF_SCHEMA: ${SF_SCHEMA}
      SF_IWH: ${SF_IWH}
      SF_PRIVATE_KEY_PATH: /keys/rsa_key.p8
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}

  # Vite with hot reload against the api container: http://localhost:5173
  web-dev:
    image: oven/bun:1
    profiles: [dev]
    depends_on: [api]
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./web:/app", "/app/node_modules"]
    environment:
      API_URL: http://api:8001

  web:
    build: ./web
    depends_on: [api]
    ports: ["8000:8000"]
    environment:
      API_URL: http://api:8001
